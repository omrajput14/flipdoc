name: Release macOS DMG

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - '.github/workflows/release-dmg.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0-beta.1)'
        required: false
        default: 'v2.1.0-beta.1'

permissions:
  contents: write

jobs:
  build-and-release-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run automated test suite
        run: swift test

      - name: Determine version tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ -f VERSION ]]; then
            TAG="$(tr -d '[:space:]' < VERSION)"
          else
            TAG="v2.1.0-beta.1"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build MELD.app and package MELD DMG
        run: |
          chmod +x Scripts/build-app.sh Scripts/build-dmg.sh
          ./Scripts/build-dmg.sh "${{ steps.ver.outputs.tag }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MELD-${{ steps.ver.outputs.tag }}-macOS-DMG
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish GitHub Release with DMG Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "MELD ${{ steps.ver.outputs.tag }} — Pre-App-Store macOS Beta"
          prerelease: true
          generate_release_notes: true
          body: |
            ## MELD ${{ steps.ver.outputs.tag }} for macOS
            **TRANSFORM • CONVERT • ORGANIZE — 100% Local & Offline**

            ### Download & Install (`.dmg`)
            1. Download **`MELD-${{ steps.ver.outputs.tag }}-macOS.dmg`** below.
            2. Open the `.dmg` and drag **`MELD.app`** into **`Applications`**.
            3. On first launch (pre-App-Store beta), **Right-click → Open** on `MELD.app`, or run in Terminal:
               ```bash
               xattr -cr /Applications/MELD.app && open /Applications/MELD.app
               ```
          files: |
            dist/*.dmg
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
