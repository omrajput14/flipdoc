name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0-beta.1)'
        required: false
        default: 'v2.1.0-beta.1'

permissions:
  contents: write

jobs:
  build-and-release-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run automated test suite
        run: swift test

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version || 'v2.1.0-beta.1' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MELD.app and package MELD DMG
        run: |
          chmod +x Scripts/build-app.sh Scripts/build-dmg.sh
          ./Scripts/build-dmg.sh "${{ steps.ver.outputs.tag }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MELD-${{ steps.ver.outputs.tag }}-macOS-DMG
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          generate_release_notes: true
